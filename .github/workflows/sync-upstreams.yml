name: Sync upstream design skills

on:
  push:
    branches: [main]
    paths:
      - upstreams.json
      - scripts/sync_upstreams.py
      - scripts/verify_bundle.py
      - .github/workflows/sync-upstreams.yml
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Sync exact upstream skill folders
        run: python scripts/sync_upstreams.py
      - name: Verify bundle structure
        run: python scripts/verify_bundle.py
      - name: Run bundle regression tests
        run: python -m pytest -q tests/test_bundle.py
      - name: Commit synchronized mirrors
        run: |
          if [[ -z "$(git status --porcelain -- skills licenses UPSTREAM_LOCK.json)" ]]; then
            echo "No upstream changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add skills licenses UPSTREAM_LOCK.json
          git commit -m "chore: sync upstream design skills"
          git push
